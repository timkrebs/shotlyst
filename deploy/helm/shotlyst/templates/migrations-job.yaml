{{/*
Migration hook Job per DB-backed service: runs `/service migrate` (the same
image and env as the Deployment), which waits for Postgres and applies the
embedded goose files. Services never migrate on start in the cluster.

Hook phase:
- install: post-install — the CNPG cluster, roles and secrets are ordinary
  release resources and do not exist before install hooks run.
- upgrade: pre-upgrade, so the schema is migrated before new pods roll.
  A service added in this upgrade has no role/secret yet (lookup finds no
  DB secret), so its first migration runs post-upgrade instead.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.db }}
{{- $root := $ }}
{{- $ctx := dict "root" $root "name" $name "svc" $svc }}
{{- $existing := lookup "v1" "Secret" $root.Release.Namespace (include "shotlyst.dbSecret" $ctx) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}-migrate
  labels:
    {{- include "shotlyst.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-migrate
  annotations:
    helm.sh/hook: {{ ternary "post-install,pre-upgrade" "post-install,post-upgrade" (not (empty $existing)) }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "shotlyst.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}-migrate
        {{- include "shotlyst.featureLabels" $ctx | nindent 8 }}
    spec:
      {{- include "shotlyst.podSpec" $root | nindent 6 }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "shotlyst.image" (dict "root" $root "name" $name) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "shotlyst.serviceEnv" $ctx | nindent 12 }}
          resources:
            {{- toYaml ($svc.resources | default $root.Values.resources.default) | nindent 12 }}
          securityContext:
            {{- include "shotlyst.securityContext" (dict) | nindent 12 }}
{{- end }}
{{- end }}
