{{/*
The SPA: unprivileged nginx serving the built bundle on :8080 (same port
and probe paths as the Go services). nginx needs a writable /tmp for its
pid and temp files; everything else is read-only.
*/}}
{{- if .Values.web.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "shotlyst.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "shotlyst.selector" (dict "Release" .Release "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shotlyst.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "shotlyst.podSpec" . | nindent 6 }}
      containers:
        - name: web
          image: {{ .Values.web.image }}:{{ include "shotlyst.tag" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          {{- include "shotlyst.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "shotlyst.securityContext" (dict "uid" 101) | nindent 12 }}{{/* nginx-unprivileged's user */}}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "shotlyst.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "shotlyst.selector" (dict "Release" .Release "component" "web") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
