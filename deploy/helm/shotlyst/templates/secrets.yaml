{{/*
Secrets the chart owns:
- auth: the Ed25519 keypair (skipped when vault.enabled; ExternalSecrets
  provide it then). Private key is only referenced by identity's env.
- db-<service>: one per DB-backed service. With CNPG it is a basic-auth
  secret CNPG uses to create/update the role; the derived password is
  stable across upgrades. `url` is what the service reads.
- s3: object storage credentials (skipped when vault.enabled).
*/}}
{{- if not .Values.vault.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shotlyst.authSecret" . }}
  labels: {{- include "shotlyst.labels" . | nindent 4 }}
type: Opaque
stringData:
  privateKey: {{ required "auth.privateKey is required (go run ./cmd/keygen)" .Values.auth.privateKey | quote }}
  publicKey: {{ required "auth.publicKey is required (go run ./cmd/keygen)" .Values.auth.publicKey | quote }}
{{- if include "shotlyst.needsS3" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shotlyst.s3Secret" . }}
  labels: {{- include "shotlyst.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.s3.accessKey | quote }}
  secretKey: {{ .Values.s3.secretKey | quote }}
{{- end }}
{{- end }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.db }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shotlyst.dbSecret" $ctx }}
  labels:
    {{- include "shotlyst.labels" $ | nindent 4 }}
    cnpg.io/reload: "true"   # CNPG re-applies the role password on change
type: kubernetes.io/basic-auth
stringData:
  username: {{ $name }}
  password: {{ include "shotlyst.dbPassword" $ctx | quote }}
  url: {{ include "shotlyst.dbURL" $ctx | quote }}
{{- end }}
{{- end }}
