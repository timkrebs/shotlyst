{{/*
Default deny for Shotlyst pods, then explicit allows (docs/07 §6):
- DNS egress for everyone;
- HTTP ingress to services and web from the allowed namespaces (ingress
  controller, Prometheus);
- service → service along `calls` (egress on the caller, ingress on the
  callee);
- pods labelled shotlyst.io/db → Postgres :5432, shotlyst.io/s3 → MinIO :9000.
CNPG's own pods are not selected (they carry no shotlyst name label), so
the operator's traffic is unaffected. Note: enforcement needs a CNI that
implements NetworkPolicy (flannel alone does not).
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $sel := dict "app.kubernetes.io/name" "shotlyst" "app.kubernetes.io/instance" .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels: {{- include "shotlyst.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- toYaml $sel | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }} } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-http-in
  labels: {{- include "shotlyst.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- toYaml $sel | nindent 6 }}
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [web, {{ keys .Values.services | sortAlpha | join ", " }}] }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } }
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
{{- range $name, $svc := .Values.services }}
{{- if $svc.calls }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-calls
  labels: {{- include "shotlyst.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "shotlyst.selector" (dict "Release" $.Release "component" $name) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {{- toYaml $sel | nindent 14 }}
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [{{ $svc.calls | join ", " }}] }
      ports:
        - { protocol: TCP, port: 8080 }
{{- range $target := $svc.calls }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ $target }}-from-{{ $name }}
  labels: {{- include "shotlyst.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "shotlyst.selector" (dict "Release" $.Release "component" $target) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "shotlyst.selector" (dict "Release" $.Release "component" $name) | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8080 }
{{- end }}
{{- end }}
{{- end }}
{{- if gt (len (include "shotlyst.dbUsers" .)) 0 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-postgres
  labels: {{- include "shotlyst.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- toYaml (merge (dict "shotlyst.io/db" "true") $sel) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    # External database: any destination on 5432; otherwise only the CNPG pods.
    - ports:
        - { protocol: TCP, port: 5432 }
      {{- if not .Values.postgres.external.url }}
      to:
        - podSelector:
            matchLabels: { cnpg.io/cluster: {{ include "shotlyst.pgCluster" . }} }
      {{- end }}
{{- end }}
{{- if gt (len (include "shotlyst.s3Users" .)) 0 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-s3
  labels: {{- include "shotlyst.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- toYaml (merge (dict "shotlyst.io/s3" "true") $sel) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - { protocol: TCP, port: 9000 }
{{- end }}
{{- end }}
