{{/*
With vault.enabled, the auth keypair and S3 credentials come from Vault via
External Secrets Operator instead of chart values. Database secrets stay
chart-rendered: their passwords are derived from postgres.passwordSeed and
CNPG needs them to create the roles.
*/}}
{{- if .Values.vault.enabled }}
{{- if not (.Capabilities.APIVersions.Has "external-secrets.io/v1") }}
{{- fail "vault.enabled=true but the External Secrets Operator CRDs (external-secrets.io/v1) are not installed" }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "shotlyst.authSecret" . }}
  labels: {{- include "shotlyst.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.vault.secretStore }} }
  target: { name: {{ include "shotlyst.authSecret" . }} }
  data:
    - { secretKey: privateKey, remoteRef: { key: {{ .Values.vault.path }}/auth, property: privateKey } }
    - { secretKey: publicKey,  remoteRef: { key: {{ .Values.vault.path }}/auth, property: publicKey } }
{{- if include "shotlyst.needsS3" . }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "shotlyst.s3Secret" . }}
  labels: {{- include "shotlyst.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.vault.secretStore }} }
  target: { name: {{ include "shotlyst.s3Secret" . }} }
  data:
    - { secretKey: accessKey, remoteRef: { key: {{ .Values.vault.path }}/s3, property: accessKey } }
    - { secretKey: secretKey, remoteRef: { key: {{ .Values.vault.path }}/s3, property: secretKey } }
{{- end }}
{{- end }}
