{{/* Alerts from docs/08-observability.md §5 (Prometheus Operator only). */}}
{{- if and .Values.monitoring.alerts.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "shotlyst.labels" . | nindent 4 }}
spec:
  groups:
    - name: shotlyst
      rules:
        - alert: ShotlystPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[15m]) > 2
          labels: { severity: warning }
          annotations:
            summary: "{{ "{{ $labels.pod }}" }} restarted more than twice in 15 minutes"
        - alert: ShotlystErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5..", namespace="{{ .Release.Namespace }}"}[5m])) by (service)
              / sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])) by (service) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ "{{ $labels.service }}" }} answers more than 5% of requests with 5xx"
        - alert: ShotlystDependencyDown
          expr: kube_pod_status_ready{namespace="{{ .Release.Namespace }}", condition="true"} == 0
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "{{ "{{ $labels.pod }}" }} not ready for 2 minutes (see 'dependency unavailable' in Loki)"
{{- end }}
