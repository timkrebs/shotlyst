{{/*
One Deployment + Service per entry in .Values.services. This is the only
place a service workload is defined — never hand-write per-service
manifests. The planning/export/etc. differences are data (values), not
templates.
*/}}
{{- range $name, $svc := .Values.services }}
{{- $root := $ }}
{{- $ctx := dict "root" $root "name" $name "svc" $svc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels:
    {{- include "shotlyst.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default $root.Values.replicas }}
  selector:
    matchLabels:
      {{- include "shotlyst.selector" (dict "Release" $root.Release "component" $name) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "shotlyst.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- include "shotlyst.featureLabels" $ctx | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        # Env from Secrets is read only at start: roll the pods when a secret
        # this service mounts changes (public key, identity's private key,
        # derived DB password). Vault-managed secrets are not covered.
        checksum/secrets: {{ list $root.Values.auth.publicKey (eq $name "identity" | ternary $root.Values.auth.privateKey "") (empty $svc.db | ternary "" (include "shotlyst.dbURL" $ctx)) | join "/" | sha256sum | trunc 16 }}
    spec:
      {{- include "shotlyst.podSpec" $root | nindent 6 }}
      terminationGracePeriodSeconds: 20   # app drains for up to 15 s on SIGTERM
      containers:
        - name: {{ $name }}
          image: {{ include "shotlyst.image" (dict "root" $root "name" $name) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "shotlyst.serviceEnv" $ctx | nindent 12 }}
          {{- include "shotlyst.probes" $root | nindent 10 }}
          resources:
            {{- toYaml ($svc.resources | default $root.Values.resources.default) | nindent 12 }}
          securityContext:
            {{- include "shotlyst.securityContext" (dict) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels:
    {{- include "shotlyst.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    {{- include "shotlyst.selector" (dict "Release" $root.Release "component" $name) | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
