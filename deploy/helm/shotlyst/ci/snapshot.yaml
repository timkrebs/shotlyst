apiVersion: apps/v1
kind: Deployment
metadata:
  name: shotlyst-identity
  labels:
    app.kubernetes.io/name: shotlyst
    app.kubernetes.io/instance: shotlyst
    app.kubernetes.io/version: "snapshot"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shotlyst
      app.kubernetes.io/instance: shotlyst
      app.kubernetes.io/component: identity
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shotlyst
        app.kubernetes.io/instance: shotlyst
        app.kubernetes.io/version: "snapshot"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: identity
        
        shotlyst.io/db: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        # Env from Secrets is read only at start: roll the pods when a secret
        # this service mounts changes (public key, identity's private key,
        # derived DB password). Vault-managed secrets are not covered.
        checksum/secrets: 2d5328f038447eb2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 20   # app drains for up to 15 s on SIGTERM
      containers:
        - name: identity
          image: ghcr.io/timkrebs/shotlyst-identity:snapshot
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: GOMEMLIMIT
              valueFrom: { resourceFieldRef: { resource: limits.memory } }
            - name: SHOTLYST_LOG_FORMAT
              value: json
            - name: SHOTLYST_LOG_LEVEL
              value: "info"
            - name: SHOTLYST_AUTO_MIGRATE
              value: "false"
            - name: SHOTLYST_TRUSTED_PROXIES
              value: "1"
            - name: SHOTLYST_BASE_URL
              value: "http://shotlyst.home.local"
            - name: SHOTLYST_AUTH_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: shotlyst-auth, key: publicKey } }
            - name: SHOTLYST_DATABASE_URL
              valueFrom: { secretKeyRef: { name: shotlyst-db-identity, key: url } }
            - name: SHOTLYST_AUTH_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: shotlyst-auth, key: privateKey } }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 48Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
