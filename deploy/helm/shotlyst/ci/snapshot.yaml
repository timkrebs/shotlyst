# Source: shotlyst/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shotlyst
  labels:
    app.kubernetes.io/name: shotlyst
    app.kubernetes.io/instance: shotlyst
    app.kubernetes.io/version: "snapshot"
    app.kubernetes.io/managed-by: Helm
  annotations:
    {}
spec:
  ingressClassName: nginx
  rules:
    - host: "shotlyst.home.local"
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: shotlyst-identity
                port: { name: http }
          - path: /api/v1/sun
            pathType: Prefix
            backend:
              service:
                name: shotlyst-sun
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shotlyst-web
                port: { name: http }
