apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shotlyst-pg
  labels:
    app.kubernetes.io/name: shotlyst
    app.kubernetes.io/instance: shotlyst
    app.kubernetes.io/version: "snapshot"
    app.kubernetes.io/managed-by: Helm
spec:
  instances: 1
  storage:
    size: 5Gi
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  bootstrap:
    initdb:
      database: shotlyst
      owner: shotlyst
  managed:
    roles:
      - name: identity
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: shotlyst-db-identity
