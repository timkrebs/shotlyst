# Source: shotlyst/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shotlyst
  labels:
    app.kubernetes.io/name: shotlyst
    app.kubernetes.io/instance: shotlyst
    app.kubernetes.io/version: "snapshot"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: shotlyst
      rules:
        - alert: ShotlystPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="shotlyst"}[15m]) > 2
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} restarted more than twice in 15 minutes"
        - alert: ShotlystErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5..", namespace="shotlyst"}[5m])) by (service)
              / sum(rate(http_requests_total{namespace="shotlyst"}[5m])) by (service) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.service }} answers more than 5% of requests with 5xx"
        - alert: ShotlystDependencyDown
          expr: kube_pod_status_ready{namespace="shotlyst", condition="true"} == 0
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} not ready for 2 minutes (see 'dependency unavailable' in Loki)"
