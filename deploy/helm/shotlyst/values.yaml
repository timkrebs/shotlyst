# Shotlyst umbrella chart. One generic template renders every entry in
# `services`; add a service here and it gets a Deployment, Service, ingress
# path, NetworkPolicy rules, migration hook (if db) and ServiceMonitor
# target. See docs/07-deployment.md.

image:
  registry: ghcr.io/timkrebs/shotlyst   # images are <registry>-<service>:<tag>
  tag: ""                               # empty → Chart.appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []                       # e.g. [{name: ghcr}] for a private GHCR package

# One entry per Go service. Keys:
#   path   ingress prefix the service mounts its API under (app.Options.Prefix)
#   db     owns a Postgres schema of the same name → role, secret, migration Job
#   s3     needs object storage credentials
#   calls  services it calls over HTTP (NetworkPolicy egress/ingress)
#   env    extra non-secret env vars
#   replicas / resources  per-service overrides
# Services land here as their milestone ships (M1 gear+media, M2 planning,
# M3 export); see docs/06.
services:
  identity:
    path: /api/v1/auth
    db: true
  sun:
    path: /api/v1/sun
    db: false
  # gear:     { path: /api/v1/gear,   db: true }
  # planning: { path: /api/v1/plan,   db: true, calls: [gear, sun, media],
  #             env: { SHOTLYST_GEAR_URL: http://shotlyst-gear:8080, SHOTLYST_SUN_URL: http://shotlyst-sun:8080, SHOTLYST_MEDIA_URL: http://shotlyst-media:8080 } }
  # media:    { path: /api/v1/media,  db: true, s3: true }
  # export:   { path: /api/v1/export, db: false, calls: [planning], env: { SHOTLYST_PLANNING_URL: http://shotlyst-planning:8080 } }

web:
  enabled: true
  image: ghcr.io/timkrebs/shotlyst-web   # tag follows image.tag
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits:   { memory: 64Mi }

replicas: 1   # single node; raise per service via services.<name>.replicas

resources:
  default:
    requests: { cpu: 20m, memory: 48Mi }
    limits:   { memory: 128Mi }

logLevel: info

# Reverse-proxy hops in front of the pods (the ingress controller = 1; add
# one per tunnel/CDN that appends to X-Forwarded-For). The client IP used
# for logs and the login rate limit is read from that position; too low lets
# clients spoof it. → SHOTLYST_TRUSTED_PROXIES
trustedProxies: 1

auth:
  # Ed25519 keys, base64. Generate with `go run ./cmd/keygen`.
  # Private key is mounted only into identity; public key into every service.
  # Required unless vault.enabled.
  privateKey: ""
  publicKey: ""

postgres:
  cnpg:
    enabled: true          # needs the CloudNativePG operator (>= 1.26) installed
    instances: 1
    storage: 5Gi
    storageClass: ""       # empty → cluster default
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { memory: 1Gi }
    backup:
      enabled: false
      destinationPath: s3://backups/shotlyst   # bucket must exist; uses the s3.* endpoint and credentials
      schedule: "0 0 3 * * *"   # CNPG cron has a seconds field: daily 03:00
      retention: 14d
      # Archive folder name under destinationPath; empty → "<release>-pg".
      # Must change after a restore: a cluster cannot archive into the
      # folder it recovered from.
      serverName: ""
    recovery:
      enabled: false     # bootstrap the Cluster from the archive instead of initdb (README "Restore")
      serverName: ""     # archive folder to restore from, e.g. shotlyst-pg
      targetTime: ""     # optional PITR target, RFC 3339; empty → latest WAL
  external:
    url: ""   # if set, cnpg is ignored and all services use this DSN (schemas isolate them)
  # Per-service role passwords are derived from this seed (HMAC-style
  # sha256), so they are stable across upgrades without storing state.
  # Defaults to auth.privateKey; set it explicitly when vault.enabled.
  passwordSeed: ""

s3:
  minio:
    # MinIO no longer publishes free images on Docker Hub or quay.io, so the
    # bundled MinIO is off until the S3 implementation is decided (needed
    # from M1, media). TODO(spec): see docs/07 open questions.
    enabled: false
    image: minio/minio:latest
    storage: 10Gi
  endpoint: http://shotlyst-minio:9000
  bucket: shotlyst
  accessKey: minioadmin
  secretKey: minioadmin

ingress:
  enabled: true
  className: nginx
  host: shotlyst.home.local
  tls: false
  annotations: {}

monitoring:
  # Rendered only when the Prometheus Operator CRDs exist in the cluster;
  # the pods also carry prometheus.io/* scrape annotations either way.
  serviceMonitor:
    enabled: true
  alerts:
    enabled: true

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the HTTP pods (ingress controller,
  # Prometheus). Matched on the kubernetes.io/metadata.name label.
  allowFromNamespaces: [ingress-nginx, monitoring]
  # Namespace running cluster DNS (egress on port 53 is allowed to it).
  dnsNamespace: kube-system

vault:
  enabled: false   # when true: render ExternalSecrets (auth, S3) instead of Secrets
  path: kv/shotlyst
  secretStore: vault   # ClusterSecretStore name
