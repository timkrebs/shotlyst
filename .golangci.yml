# Lint config enforcing the three principles: simple, DRY, documented.
version: "2"
linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive        # doc comments on exported symbols (see settings)
    - dupl          # flags copy-pasted blocks → move them to pkg/
    - gocyclo       # keep functions simple
    - misspell
    - unparam
    - bodyclose
    - sqlclosecheck
    - noctx
  settings:
    dupl:
      threshold: 80
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported          # every exported symbol needs a doc comment
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: package-comments  # every package needs a package comment
        - name: context-as-argument
        - name: error-strings
        - name: error-return
        - name: unexported-return
  exclusions:
    # sqlc output (services/*/store/*.sql.go, db.go, models.go) carries a
    # "Code generated" header and is skipped by golangci-lint automatically.
    paths:
      - web
    rules:
      # Tests build requests from scratch; threading a context through every
      # httptest call adds noise without catching anything.
      - path: _test\.go
        linters: [noctx]
