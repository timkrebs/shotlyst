# Local development stack. Mirrors the cluster topology:
# caddy does the same path routing as the Kubernetes ingress, so the SPA
# talks to one origin (http://localhost:8080) exactly like in production.
#
# Services use `air` for hot reload (.air.toml builds ./cmd/$SHOTLYST_SERVICE);
# a single x-service anchor keeps the definitions DRY — each service only
# overrides SHOTLYST_SERVICE and its dependency URLs. A new service is one
# entry here (plus Helm values and the CI matrix).

x-service: &go-service
  build:
    context: .
    dockerfile: docker/Dockerfile.dev        # golang + air; see docs/02 §7
  volumes:
    - .:/src
    - gomod:/go/pkg/mod                      # module + build caches survive restarts
    - gocache:/root/.cache/go-build
  env_file: .env
  # Shared, non-secret settings live in .env (loaded via env_file) because a
  # YAML merge would replace the whole `environment` mapping per service.
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shotlyst
      POSTGRES_PASSWORD: shotlyst
      POSTGRES_DB: shotlyst
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shotlyst"]
      interval: 3s
      retries: 10

  # Object storage for media (M1). Behind a profile because MinIO no longer
  # publishes free images (docker.io/minio/minio and quay.io are denied);
  # TODO(spec): pick the S3 implementation — see docs/07 open questions.
  minio:
    profiles: [media]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  identity:
    <<: *go-service
    environment: { SHOTLYST_SERVICE: identity }

  sun:
    <<: *go-service
    environment: { SHOTLYST_SERVICE: sun }

  web:
    image: node:22-alpine
    working_dir: /app
    # The anonymous volume keeps the container's Linux node_modules apart
    # from the host's (native packages differ per OS).
    volumes: ["./web:/app", "/app/node_modules"]
    command: sh -c "npm ci && npm run dev -- --host"
    ports: ["5173:5173"]

  router:
    image: caddy:2-alpine
    ports: ["8080:8080"]
    volumes: ["./docker/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [identity, sun, web]

volumes:
  pgdata:
  miniodata:
  gomod:
  gocache:
