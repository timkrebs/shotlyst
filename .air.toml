# air hot-reload config shared by every service in docker-compose.
# The service to build comes from the SHOTLYST_SERVICE env var.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/${SHOTLYST_SERVICE} ./cmd/${SHOTLYST_SERVICE}"
  bin = "./tmp/${SHOTLYST_SERVICE}"
  include_ext = ["go", "sql"]
  exclude_dir = ["web", "tmp", "deploy", "docs", "node_modules"]
  delay = 500
  # Bind mounts from a macOS host into the Podman/Docker VM do not deliver
  # inotify events, so watch by polling instead.
  poll = true
  poll_interval = 1000
  # On reload, stop the old process with SIGINT and let it drain (like
  # SIGTERM in a pod), so "shutting down"/"stopped" show up locally too.
  # Stopping the container kills air's child without a drain; the
  # production image runs the binary as PID 1 and drains on SIGTERM.
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = false
