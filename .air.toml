# air hot-reload config shared by every service in docker-compose.
# The service to build comes from the SHOTLYST_SERVICE env var.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/${SHOTLYST_SERVICE} ./cmd/${SHOTLYST_SERVICE}"
  bin = "./tmp/${SHOTLYST_SERVICE}"
  include_ext = ["go", "sql"]
  exclude_dir = ["web", "tmp", "deploy", "docs", "node_modules"]
  delay = 500
  # Bind mounts from a macOS host into the Podman/Docker VM do not deliver
  # inotify events, so watch by polling instead.
  poll = true
  poll_interval = 1000

[log]
  time = false
