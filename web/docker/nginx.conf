# SPA server. Hashed assets are immutable; index.html (and the service
# worker, once M4 adds it) must always be revalidated so a deploy is picked
# up on the next load. Unknown paths fall back to index.html for client-side
# routing. /healthz and /readyz mirror the Go services for uniform probes.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout;
    server_tokens off;

    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = /readyz  { access_log off; default_type application/json; return 200 '{"ready":true}'; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
