openapi: 3.1.0
info:
  title: Shotlyst shared schemas
  version: 0.1.0
  description: >
    Shared component schemas ($ref'd from api/<service>.yaml). Enums here
    mirror docs/03-data-model.md and the Postgres enum types. Each service
    spec is generated into its own TS client (make gen).
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: shotlyst_session
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    ShotSize:
      type: string
      enum: [EWS, WS, MWS, MS, MCU, CU, ECU, INSERT, POV, OTS]
    CameraMovement:
      type: string
      enum: [static, pan, tilt, handheld, gimbal, slider, dolly, crane, drone, walk_and_talk, whip, zoom, rack_focus, other]
    FrameRate:
      type: string
      enum: ["23_976", "24", "25", "29_97", "30", "50", "59_94", "60", "100", "120", "240"]
    AudioNeed:
      type: string
      enum: [none, ambience, dialogue, voiceover_later, music_only]
    ShotPriority:
      type: string
      enum: [must, should, nice]
    ShotStatus:
      type: string
      enum: [planned, done, redo, skipped]
    TimeOfDay:
      type: string
      enum: [any, pre_dawn, sunrise, golden_morning, morning, midday, afternoon, golden_evening, sunset, blue_hour, night]
    SensorFormat:
      type: string
      enum: [full_frame, aps_c, super35, mft, one_inch, other]
    LensMount:
      type: string
      enum: [sony_e, canon_rf, nikon_z, l_mount, fuji_x, mft, pl, other]
    ProjectStatus:
      type: string
      enum: [planning, shooting, post, done, archived]
    # Resource schemas (User, Camera, Lens, Project, Beat, Shot, ShootDay,
    # Location, IdeaCard, SunTimes, SyncRequest, SyncResponse) are to be
    # added in M1–M4 following docs/03-data-model.md and docs/04-api.md.
