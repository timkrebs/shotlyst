openapi: 3.1.0
info:
  title: Shotlyst sun service
  version: 0.1.0
  description: >
    Stateless sunrise/sunset/golden-hour calculation (NOAA algorithm, no
    external API). Mounted at /api/v1/sun. Requires a session; planning
    calls it with the user's forwarded token. Results are cached for 1 h.
servers:
  - url: /api/v1/sun
security:
  - session: []
paths:
  /times:
    get:
      operationId: getSunTimes
      summary: Sun times for a location and local date
      parameters:
        - { name: lat,  in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon,  in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: Local calendar date in `tz`. }
        - { name: tz,   in: query, required: true, schema: { type: string }, description: "IANA zone, e.g. Europe/Berlin" }
      responses:
        "200":
          description: >
            Times in the requested zone, all on the requested local date.
            null when the event does not occur (polar day/night); on such
            days sunrise, sunset, civil dawn/dusk and solar noon are all null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SunTimes" }
        "401": { $ref: "./_shared-schemas.yaml#/components/responses/Unauthorized" }
        "422": { $ref: "./_shared-schemas.yaml#/components/responses/Validation" }
components:
  securitySchemes:
    session: { $ref: "./_shared-schemas.yaml#/components/securitySchemes/session" }
  schemas:
    SunTimes:
      type: object
      required: [sunrise, sunset, solar_noon, civil_dawn, civil_dusk, golden_morning_start, golden_morning_end,
                 golden_evening_start, golden_evening_end, blue_morning_start, blue_evening_end]
      properties:
        sunrise:              { type: [string, "null"], format: date-time }
        sunset:               { type: [string, "null"], format: date-time }
        solar_noon:           { type: [string, "null"], format: date-time }
        civil_dawn:           { type: [string, "null"], format: date-time }
        civil_dusk:           { type: [string, "null"], format: date-time }
        golden_morning_start: { type: [string, "null"], format: date-time, description: "Sun at -4°, rising" }
        golden_morning_end:   { type: [string, "null"], format: date-time, description: "Sun at +6°, rising" }
        golden_evening_start: { type: [string, "null"], format: date-time, description: "Sun at +6°, setting" }
        golden_evening_end:   { type: [string, "null"], format: date-time, description: "Sun at -4°, setting" }
        blue_morning_start:   { type: [string, "null"], format: date-time, description: "Sun at -6°, rising" }
        blue_evening_end:     { type: [string, "null"], format: date-time, description: "Sun at -6°, setting" }
