openapi: 3.1.0
info:
  title: Shotlyst identity service
  version: 0.1.0
  description: >
    Accounts and sessions, mounted at /api/v1/auth. Successful register,
    login and refresh set the HttpOnly `shotlyst_session` cookie (an
    Ed25519-signed token valid for 24 h; the server-side session behind it
    lives 30 days and slides on refresh). The SPA calls /refresh when a
    request returns 401, then retries once.
servers:
  - url: /api/v1/auth
paths:
  /register:
    post:
      operationId: register
      summary: Create an account and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created; session cookie set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "./_shared-schemas.yaml#/components/responses/Forbidden" }
        "409":
          description: The email is already registered.
          content: { application/problem+json: { schema: { $ref: "./_shared-schemas.yaml#/components/schemas/Problem" } } }
        "422": { $ref: "./_shared-schemas.yaml#/components/responses/Validation" }
        "429": { $ref: "./_shared-schemas.yaml#/components/responses/TooManyRequests" }
  /login:
    post:
      operationId: login
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; session cookie set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "./_shared-schemas.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "./_shared-schemas.yaml#/components/responses/Forbidden" }
        "429": { $ref: "./_shared-schemas.yaml#/components/responses/TooManyRequests" }
  /logout:
    post:
      operationId: logout
      summary: Revoke the current session and clear the cookie
      description: >
        Always succeeds. Other services accept the old token until it
        expires (≤ 24 h); see docs/02 §4.
      security: [{}, { session: [] }]
      responses:
        "204": { description: Logged out; cookie cleared. }
        "403": { $ref: "./_shared-schemas.yaml#/components/responses/Forbidden" }
  /refresh:
    post:
      operationId: refresh
      summary: Exchange the current token for a new one
      description: >
        Accepts an expired token as long as it is the session's current
        token and the session is still live. A token that was already
        rotated out is rejected.
      security: [{ session: [] }]
      responses:
        "204":
          description: New session cookie set.
          headers:
            Set-Cookie: { schema: { type: string } }
        "401": { $ref: "./_shared-schemas.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "./_shared-schemas.yaml#/components/responses/Forbidden" }
  /me:
    get:
      operationId: getMe
      summary: The logged-in user
      security: [{ session: [] }]
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "./_shared-schemas.yaml#/components/responses/Unauthorized" }
    patch:
      operationId: updateMe
      summary: Update display name and/or locale
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "./_shared-schemas.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "./_shared-schemas.yaml#/components/responses/Forbidden" }
        "422": { $ref: "./_shared-schemas.yaml#/components/responses/Validation" }
components:
  securitySchemes:
    session: { $ref: "./_shared-schemas.yaml#/components/securitySchemes/session" }
  schemas:
    Locale:
      type: string
      enum: [en, de]
    User:
      type: object
      required: [id, email, display_name, locale, updated_at]
      properties:
        id:           { type: string, format: uuid }
        email:        { type: string, format: email, description: Stored lowercased. }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        locale:       { $ref: "#/components/schemas/Locale" }
        updated_at:   { type: string, format: date-time }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email:        { type: string, format: email }
        password:     { type: string, minLength: 8, maxLength: 128 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:    { type: string }
        password: { type: string }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 80 }
        locale:       { $ref: "#/components/schemas/Locale" }
